<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop — Activity Search</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/search.css" />
</head>
<body>

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header class="page-header">
  <a href="#" class="logo">Travel<span>oop</span></a>
  <nav class="nav-links">
    <a href="city_search.html">Cities</a>
    <a href="activity_search.html" class="active">Activities</a>
    <a href="budget.html">Budget</a>
  </nav>
  <button class="cart-fab" id="cartFab" aria-label="View trip cart">
    🎒
    <span class="fab-badge" id="cartCount">0</span>
  </button>
</header>

<!-- ══════════════════════ MAIN ══════════════════════ -->
<main class="search-page">

  <h1 class="page-title">Explore Activities</h1>
  <p class="page-subtitle">Browse thousands of experiences — filter by category, price, and city.</p>

  <!-- Search Bar -->
  <div class="search-bar-wrap" id="activitySearchWrap">
    <div class="search-input-group">
      <svg class="search-icon" width="18" height="18" fill="none" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        id="activitySearchInput"
        class="search-input"
        placeholder="Search activities, e.g. Hiking, Museum, Scuba diving…"
        autocomplete="off"
        aria-label="Search activities"
      />
      <button class="search-btn" id="activitySearchBtn">Search</button>
    </div>
    <ul class="autocomplete-list" id="activityAutocomplete" role="listbox" style="display:none"></ul>
  </div>

  <!-- Filter Bar — Categories -->
  <div class="filter-bar" id="activityFilterBar">
    <span class="filter-label">Category</span>
    <button class="filter-chip active" data-category="all">All</button>
    <button class="filter-chip" data-category="Adventure">🧗 Adventure</button>
    <button class="filter-chip" data-category="Culture">🏛️ Culture</button>
    <button class="filter-chip" data-category="Food">🍜 Food</button>
    <button class="filter-chip" data-category="Nature">🌿 Nature</button>
    <button class="filter-chip" data-category="Nightlife">🎉 Nightlife</button>
    <button class="filter-chip" data-category="Wellness">🧘 Wellness</button>
    <button class="filter-chip" data-category="Sports">⚽ Sports</button>
  </div>

  <!-- Filter Bar — Cost -->
  <div class="filter-bar" style="margin-top:-14px;">
    <span class="filter-label">Price</span>
    <button class="filter-chip" data-price="free">Free</button>
    <button class="filter-chip" data-price="budget">Under ₹500</button>
    <button class="filter-chip" data-price="mid">₹500–₹2000</button>
    <button class="filter-chip" data-price="premium">₹2000+</button>

    <select class="filter-select" id="cityFilterSelect" aria-label="Filter by city">
      <option value="">All Cities</option>
    </select>

    <select class="filter-select" id="activitySortSelect" aria-label="Sort activities">
      <option value="name">Sort: A – Z</option>
      <option value="cost_asc">Price: Low first</option>
      <option value="cost_desc">Price: High first</option>
      <option value="rating">Top Rated</option>
      <option value="duration">Duration</option>
    </select>
  </div>

  <!-- Results Meta -->
  <div class="results-meta">
    <p class="results-count">Showing <strong id="activityResultCount">0</strong> activities</p>
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" id="activityGrid">
    <div class="spinner"></div>
  </div>

</main>

<!-- ══════════════════════ TRIP CART ══════════════════════ -->
<aside class="trip-cart" id="tripCart" aria-label="Trip cart">
  <div class="trip-cart-header">
    <h3>🎒 My Activities</h3>
    <button class="cart-close-btn" id="cartClose" aria-label="Close cart">✕</button>
  </div>
  <div class="trip-cart-body" id="cartBody">
    <p style="color:var(--text-muted);font-size:13.5px;padding-top:16px;">No activities added yet.</p>
  </div>
  <div class="trip-cart-footer">
    <div class="cart-total">
      <span>Activities Total</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="cart-action-btn" onclick="window.location.href='budget.html'">Calculate Budget →</button>
  </div>
</aside>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="../js/search.js"></script>
</body>
</html>
