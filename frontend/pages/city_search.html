<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop — City Search</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/search.css" />
</head>
<body>

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header class="page-header">
  <a href="#" class="logo">Travel<span>oop</span></a>
  <nav class="nav-links">
    <a href="city_search.html" class="active">Cities</a>
    <a href="activity_search.html">Activities</a>
    <a href="budget.html">Budget</a>
  </nav>
  <button class="cart-fab" id="cartFab" aria-label="View trip cart">
    🗺️
    <span class="fab-badge" id="cartCount">0</span>
  </button>
</header>

<!-- ══════════════════════ MAIN ══════════════════════ -->
<main class="search-page">

  <h1 class="page-title">Find Your Next City</h1>
  <p class="page-subtitle">Search 500+ destinations worldwide and add them to your trip.</p>

  <!-- Search Bar -->
  <div class="search-bar-wrap" id="citySearchWrap">
    <div class="search-input-group">
      <svg class="search-icon" width="18" height="18" fill="none" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        id="citySearchInput"
        class="search-input"
        placeholder="Search cities, e.g. Paris, Tokyo, New York…"
        autocomplete="off"
        aria-label="Search cities"
        aria-autocomplete="list"
        aria-controls="cityAutocomplete"
      />
      <button class="search-btn" id="citySearchBtn">Search</button>
    </div>
    <!-- Autocomplete -->
    <ul class="autocomplete-list" id="cityAutocomplete" role="listbox" style="display:none"></ul>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar" id="cityFilterBar">
    <span class="filter-label">Region</span>
    <button class="filter-chip active" data-region="all">All <span class="chip-count" id="countAll">—</span></button>
    <button class="filter-chip" data-region="Asia">Asia</button>
    <button class="filter-chip" data-region="Europe">Europe</button>
    <button class="filter-chip" data-region="Americas">Americas</button>
    <button class="filter-chip" data-region="Africa">Africa</button>
    <button class="filter-chip" data-region="Oceania">Oceania</button>

    <select class="filter-select" id="countrySelect" aria-label="Filter by country">
      <option value="">All Countries</option>
    </select>

    <select class="filter-select" id="sortSelect" aria-label="Sort cities">
      <option value="name">Sort: A – Z</option>
      <option value="cost_asc">Cost: Low first</option>
      <option value="cost_desc">Cost: High first</option>
      <option value="rating">Top Rated</option>
    </select>
  </div>

  <!-- Results Meta -->
  <div class="results-meta">
    <p class="results-count">Showing <strong id="resultCount">0</strong> cities</p>
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" id="cityGrid">
    <div class="spinner"></div>
  </div>

</main>

<!-- ══════════════════════ TRIP CART ══════════════════════ -->
<aside class="trip-cart" id="tripCart" aria-label="Trip cart">
  <div class="trip-cart-header">
    <h3>🗺️ My Trip</h3>
    <button class="cart-close-btn" id="cartClose" aria-label="Close cart">✕</button>
  </div>
  <div class="trip-cart-body" id="cartBody">
    <p style="color:var(--text-muted);font-size:13.5px;padding-top:16px;">No cities added yet.</p>
  </div>
  <div class="trip-cart-footer">
    <div class="cart-total">
      <span>Est. Daily Cost</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="cart-action-btn" onclick="window.location.href='budget.html'">View Budget Breakdown →</button>
  </div>
</aside>

<!-- ══════════════════════ TOAST ══════════════════════ -->
<div class="toast-container" id="toastContainer"></div>

<script src="../js/search.js"></script>
</body>
</html>
