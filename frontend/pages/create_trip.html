<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Create Trip</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
  <style>
    .create-wrapper{max-width:600px;margin:40px auto;padding:0 24px}
    .create-card{background:var(--surface);border-radius:16px;padding:40px;box-shadow:var(--shadow)}
    .create-card h1{font-size:24px;font-weight:700;margin-bottom:6px}
    .create-card p{color:var(--text-muted);margin-bottom:28px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .success-msg{background:#DCFCE7;color:#166534;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;display:none}
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-icon">✈</span>
      <span class="logo-text">Traveloop</span>
    </div>
    <div class="nav-links">
      <a href="/pages/dashboard.html">Home</a>
      <a href="/pages/my_trips.html">My Trips</a>
      <a href="/pages/profile.html">Profile</a>
    </div>
  </nav>

  <div class="create-wrapper">
    <div class="create-card">
      <h1>✈ Plan a New Trip</h1>
      <p>Fill in the details to start your adventure</p>

      <div class="success-msg" id="successMsg">Trip created! Redirecting...</div>
      <div class="error-box" id="errorBox"></div>

      <div class="form-group">
        <label>Trip Name</label>
        <input type="text" id="tripName" placeholder="e.g. Europe Summer 2026"/>
      </div>

      <div class="form-group">
        <label>Destination</label>
        <input type="text" id="destination" placeholder="e.g. Paris, Tokyo, Bali"/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="startDate"/>
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input type="date" id="endDate"/>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="What's this trip about?"></textarea>
      </div>

      <button class="btn-primary btn-full" onclick="handleCreateTrip()">Create Trip</button>
      <p style="text-align:center;margin-top:16px;font-size:14px;">
        <a href="/pages/my_trips.html" style="color:var(--text-muted);">← Back to My Trips</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) window.location.href = "/pages/login.html";

    async function handleCreateTrip() {
      const name        = document.getElementById("tripName").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const start_date  = document.getElementById("startDate").value;
      const end_date    = document.getElementById("endDate").value;
      const description = document.getElementById("description").value.trim();

      if (!name || !destination || !start_date || !end_date) {
        document.getElementById("errorBox").textContent = "Please fill in all required fields.";
        document.getElementById("errorBox").classList.add("show");
        return;
      }

      const res = await apiRequest("/trip", "POST", {
        name, destination, start_date, end_date, description,
        user_id: user.id
      });

      if (res.success) {
        document.getElementById("successMsg").style.display = "block";
        setTimeout(() => window.location.href = "/pages/my_trips.html", 1500);
      } else {
        document.getElementById("errorBox").textContent = res.message;
        document.getElementById("errorBox").classList.add("show");
      }
    }
  </script>

</body>
</html>
