<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Itinerary Builder</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
  <style>
    :root {
      --primary: #4F46E5;
      --secondary: #06B6D4;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
      --success: #22C55E;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

    .navbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 32px; height:64px; background:var(--surface);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;
    }
    .nav-logo { display:flex; align-items:center; gap:8px; }
    .nav-logo .logo-text { font-size:20px; font-weight:700; color:var(--primary); }
    .nav-logo .logo-icon { font-size:22px; }
    .nav-links { display:flex; gap:28px; }
    .nav-links a { font-size:15px; color:var(--text-muted); font-weight:500; text-decoration:none; transition:color .2s; }
    .nav-links a:hover, .nav-links a.active { color:var(--primary); }

    .builder-layout { display:grid; grid-template-columns:320px 1fr; gap:0; min-height:calc(100vh - 64px); }

    /* LEFT SIDEBAR */
    .sidebar {
      background:var(--surface); border-right:1px solid var(--border);
      padding:24px; overflow-y:auto; display:flex; flex-direction:column; gap:20px;
    }
    .sidebar-title { font-size:13px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }

    .trip-info-card {
      background:linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius:12px; padding:20px; color:white;
    }
    .trip-info-card h2 { font-size:18px; font-weight:700; margin-bottom:4px; }
    .trip-info-card p { font-size:13px; opacity:.85; }
    .trip-meta { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
    .trip-meta span {
      background:rgba(255,255,255,.2); border-radius:20px;
      padding:4px 10px; font-size:12px;
    }

    .day-list { display:flex; flex-direction:column; gap:8px; }
    .day-tab {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px; border-radius:var(--radius); cursor:pointer;
      border:2px solid transparent; transition:all .2s; background:var(--bg);
    }
    .day-tab:hover { border-color:var(--primary); background:#EEF2FF; }
    .day-tab.active { border-color:var(--primary); background:#EEF2FF; }
    .day-tab-left { display:flex; flex-direction:column; }
    .day-tab-num { font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.5px; }
    .day-tab-date { font-size:14px; font-weight:600; color:var(--text); margin-top:1px; }
    .day-tab-count { font-size:12px; color:var(--text-muted); }
    .day-tab-stops { font-size:12px; color:var(--text-muted); background:var(--border); padding:3px 8px; border-radius:20px; }

    .btn-add-day {
      width:100%; padding:11px; border:2px dashed var(--border);
      border-radius:var(--radius); background:transparent; cursor:pointer;
      color:var(--text-muted); font-size:14px; transition:all .2s;
    }
    .btn-add-day:hover { border-color:var(--primary); color:var(--primary); }

    /* MAIN CONTENT */
    .main-content { padding:28px 32px; overflow-y:auto; }

    .day-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;
    }
    .day-header h2 { font-size:22px; font-weight:700; }
    .day-header-right { display:flex; gap:10px; }

    .btn-primary {
      background:var(--primary); color:white; border:none; border-radius:var(--radius);
      padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .2s;
      text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    }
    .btn-primary:hover { opacity:.88; }
    .btn-outline {
      background:transparent; color:var(--primary); border:1.5px solid var(--primary);
      border-radius:var(--radius); padding:9px 16px; font-size:14px; font-weight:600;
      cursor:pointer; transition:all .2s;
    }
    .btn-outline:hover { background:#EEF2FF; }

    /* STOP CARDS */
    .stops-list { display:flex; flex-direction:column; gap:0; position:relative; }
    .stops-list::before {
      content:''; position:absolute; left:27px; top:0; bottom:0;
      width:2px; background:var(--border); z-index:0;
    }

    .stop-card {
      display:flex; gap:16px; align-items:flex-start;
      padding:0 0 24px 0; position:relative; z-index:1;
    }
    .stop-dot {
      width:56px; height:56px; border-radius:50%; border:3px solid white;
      box-shadow:0 0 0 2px var(--primary); background:white;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; flex-shrink:0; z-index:2;
    }
    .stop-dot.transport { box-shadow:0 0 0 2px var(--secondary); }
    .stop-dot.hotel { box-shadow:0 0 0 2px #F59E0B; }
    .stop-dot.food { box-shadow:0 0 0 2px var(--success); }

    .stop-body {
      flex:1; background:var(--surface); border-radius:12px;
      border:1px solid var(--border); overflow:hidden; transition:box-shadow .2s;
    }
    .stop-body:hover { box-shadow:var(--shadow); }

    .stop-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .stop-type-badge {
      font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;
      text-transform:uppercase; letter-spacing:.4px;
    }
    .badge-place { background:#EEF2FF; color:var(--primary); }
    .badge-transport { background:#CFFAFE; color:#0369A1; }
    .badge-hotel { background:#FEF3C7; color:#92400E; }
    .badge-food { background:#DCFCE7; color:#166534; }

    .stop-actions { display:flex; gap:6px; }
    .stop-actions button {
      background:none; border:none; cursor:pointer; color:var(--text-muted);
      padding:4px 6px; border-radius:6px; font-size:14px; transition:all .2s;
    }
    .stop-actions button:hover { background:var(--bg); color:var(--danger); }

    .stop-content { padding:14px 16px; }
    .stop-name { font-size:16px; font-weight:700; margin-bottom:4px; }
    .stop-time { font-size:13px; color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:4px; }
    .stop-notes { font-size:14px; color:var(--text-muted); line-height:1.6; }
    .stop-duration {
      display:inline-flex; align-items:center; gap:4px;
      font-size:12px; background:var(--bg); border-radius:20px;
      padding:3px 10px; margin-top:8px; color:var(--text-muted);
    }

    /* ADD STOP MODAL */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000;
      display:flex; align-items:center; justify-content:center; opacity:0;
      pointer-events:none; transition:opacity .2s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border-radius:16px; padding:28px;
      width:100%; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,.15);
      transform:translateY(20px); transition:transform .2s;
    }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal h3 { font-size:18px; font-weight:700; margin-bottom:20px; }
    .modal-form { display:flex; flex-direction:column; gap:14px; }
    .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text); }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:10px 12px; border:1.5px solid var(--border);
      border-radius:var(--radius); font-size:14px; background:var(--surface);
      color:var(--text); outline:none; transition:border .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-footer { display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
    .btn-cancel { background:var(--bg); color:var(--text-muted); border:none; border-radius:var(--radius); padding:10px 18px; cursor:pointer; font-size:14px; }

    /* TYPE SELECTOR */
    .type-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .type-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      padding:10px 8px; border:2px solid var(--border); border-radius:var(--radius);
      cursor:pointer; background:none; transition:all .2s; font-size:11px; color:var(--text-muted);
    }
    .type-btn:hover { border-color:var(--primary); }
    .type-btn.selected { border-color:var(--primary); background:#EEF2FF; color:var(--primary); font-weight:600; }
    .type-btn span { font-size:20px; }

    /* EMPTY STATE */
    .empty-day {
      text-align:center; padding:60px 20px;
      border:2px dashed var(--border); border-radius:16px; color:var(--text-muted);
    }
    .empty-day .icon { font-size:48px; margin-bottom:12px; }
    .empty-day p { margin-bottom:20px; font-size:15px; }

    /* SUMMARY BAR */
    .day-summary {
      display:flex; gap:20px; margin-bottom:24px;
      background:var(--surface); border-radius:var(--radius);
      padding:14px 20px; border:1px solid var(--border);
    }
    .day-summary-item { display:flex; flex-direction:column; }
    .day-summary-item span:first-child { font-size:11px; color:var(--text-muted); text-transform:uppercase; font-weight:600; letter-spacing:.5px; }
    .day-summary-item span:last-child { font-size:18px; font-weight:700; color:var(--primary); }

    @media(max-width:768px){
      .builder-layout { grid-template-columns:1fr; }
      .sidebar { border-right:none; border-bottom:1px solid var(--border); }
      .navbar { padding:0 16px; }
      .nav-links { display:none; }
      .main-content { padding:20px 16px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <span class="logo-icon">✈</span>
    <span class="logo-text">Traveloop</span>
  </div>
  <div class="nav-links">
    <a href="/pages/dashboard.html">Home</a>
    <a href="/pages/my_trips.html">My Trips</a>
    <a href="/pages/itinerary_builder.html" class="active">Itinerary</a>
    <a href="/pages/profile.html">Profile</a>
  </div>
  <div class="nav-right">
    <button class="btn-primary" onclick="saveItinerary()">💾 Save</button>
  </div>
</nav>

<div class="builder-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="trip-info-card" id="tripInfoCard">
      <h2 id="tripTitle">My Trip</h2>
      <p id="tripDest">Tap to edit trip details</p>
      <div class="trip-meta">
        <span id="tripDates">Select dates</span>
        <span id="tripDayCount">0 days</span>
      </div>
    </div>

    <div>
      <div class="sidebar-title">Days</div>
      <div class="day-list" id="dayList"></div>
      <button class="btn-add-day" onclick="addDay()" style="margin-top:10px;">+ Add Day</button>
    </div>

    <div>
      <div class="sidebar-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
        <div style="display:flex;align-items:center;gap:8px;"><span>📍</span><span>Place / Attraction</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><span>🚗</span><span>Transport</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><span>🏨</span><span>Hotel / Stay</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><span>🍽️</span><span>Food / Restaurant</span></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-content">
    <div class="day-header">
      <div>
        <h2 id="currentDayTitle">Day 1</h2>
        <p style="color:var(--text-muted);font-size:14px;" id="currentDayDate"></p>
      </div>
      <div class="day-header-right">
        <button class="btn-outline" onclick="openSuggestions()">💡 Get Suggestions</button>
        <button class="btn-primary" onclick="openModal()">+ Add Stop</button>
      </div>
    </div>

    <div class="day-summary" id="daySummary" style="display:none;">
      <div class="day-summary-item">
        <span>Stops</span>
        <span id="summaryStops">0</span>
      </div>
      <div class="day-summary-item">
        <span>Est. Hours</span>
        <span id="summaryHours">0h</span>
      </div>
      <div class="day-summary-item">
        <span>Start</span>
        <span id="summaryStart">—</span>
      </div>
      <div class="day-summary-item">
        <span>End</span>
        <span id="summaryEnd">—</span>
      </div>
    </div>

    <div class="stops-list" id="stopsList"></div>
  </div>
</div>

<!-- ADD STOP MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h3>Add Stop</h3>
    <div class="modal-form">
      <div class="form-group">
        <label>Type</label>
        <div class="type-grid">
          <button class="type-btn selected" data-type="place" onclick="selectType('place',this)"><span>📍</span>Place</button>
          <button class="type-btn" data-type="transport" onclick="selectType('transport',this)"><span>🚗</span>Transport</button>
          <button class="type-btn" data-type="hotel" onclick="selectType('hotel',this)"><span>🏨</span>Hotel</button>
          <button class="type-btn" data-type="food" onclick="selectType('food',this)"><span>🍽️</span>Food</button>
        </div>
      </div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="stopName" placeholder="e.g. Eiffel Tower, Hotel Le Marais…"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="stopTime"/>
        </div>
        <div class="form-group">
          <label>Duration (mins)</label>
          <input type="number" id="stopDuration" placeholder="90" min="15" step="15"/>
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="stopNotes" rows="3" placeholder="Booking info, tips, address…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addStop()">Add Stop</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) window.location.href = '/pages/login.html';

  // State
  let days = [];
  let currentDayIndex = 0;
  let selectedType = 'place';
  const tripId = new URLSearchParams(window.location.search).get('trip_id') || 1;

  const TYPE_EMOJI = { place:'📍', transport:'🚗', hotel:'🏨', food:'🍽️' };
  const TYPE_BADGE = { place:'badge-place', transport:'badge-transport', hotel:'badge-hotel', food:'badge-food' };
  const TYPE_DOT   = { place:'', transport:'transport', hotel:'hotel', food:'food' };

  // --- INIT ---
  function init() {
    const saved = localStorage.getItem(`itinerary_${tripId}`);
    if (saved) {
      days = JSON.parse(saved);
    } else {
      days = [{ label:'Day 1', date:'', stops:[] }];
    }
    // Try to get trip details
    const tripData = JSON.parse(localStorage.getItem('currentTrip') || '{}');
    if (tripData.name) document.getElementById('tripTitle').textContent = tripData.name;
    if (tripData.destination) document.getElementById('tripDest').textContent = tripData.destination;
    if (tripData.start_date) {
      document.getElementById('tripDates').textContent = tripData.start_date + (tripData.end_date ? ' → ' + tripData.end_date : '');
      document.getElementById('tripDayCount').textContent = days.length + ' day' + (days.length !== 1 ? 's' : '');
      // Auto-assign dates to days
      if (tripData.start_date && days[0].date === '') {
        const start = new Date(tripData.start_date);
        days.forEach((d, i) => {
          const dt = new Date(start);
          dt.setDate(dt.getDate() + i);
          d.date = dt.toISOString().split('T')[0];
          d.label = `Day ${i+1}`;
        });
      }
    }
    renderDayList();
    renderStops();
  }

  // --- DAY LIST ---
  function renderDayList() {
    const list = document.getElementById('dayList');
    list.innerHTML = '';
    days.forEach((day, i) => {
      const tab = document.createElement('div');
      tab.className = 'day-tab' + (i === currentDayIndex ? ' active' : '');
      tab.innerHTML = `
        <div class="day-tab-left">
          <span class="day-tab-num">${day.label}</span>
          <span class="day-tab-date">${day.date ? formatDate(day.date) : 'No date set'}</span>
        </div>
        <span class="day-tab-stops">${day.stops.length} stop${day.stops.length !== 1 ? 's' : ''}</span>
      `;
      tab.onclick = () => { currentDayIndex = i; renderDayList(); renderStops(); };
      list.appendChild(tab);
    });
    document.getElementById('tripDayCount').textContent = days.length + ' day' + (days.length !== 1 ? 's' : '');
  }

  // --- STOPS ---
  function renderStops() {
    const day = days[currentDayIndex];
    document.getElementById('currentDayTitle').textContent = day.label;
    document.getElementById('currentDayDate').textContent = day.date ? formatDate(day.date) : '';

    const list = document.getElementById('stopsList');
    const summary = document.getElementById('daySummary');

    if (!day.stops.length) {
      list.innerHTML = `
        <div class="empty-day">
          <div class="icon">🗺️</div>
          <p>No stops yet for ${day.label}</p>
          <button class="btn-primary" onclick="openModal()">+ Add First Stop</button>
        </div>`;
      summary.style.display = 'none';
      return;
    }

    summary.style.display = 'flex';
    let totalMins = 0;
    day.stops.forEach(s => totalMins += (s.duration || 0));
    document.getElementById('summaryStops').textContent = day.stops.length;
    document.getElementById('summaryHours').textContent = Math.round(totalMins/60*10)/10 + 'h';
    document.getElementById('summaryStart').textContent = day.stops[0].time || '—';
    document.getElementById('summaryEnd').textContent = day.stops[day.stops.length-1].time || '—';

    list.innerHTML = '';
    day.stops.forEach((stop, i) => {
      const card = document.createElement('div');
      card.className = 'stop-card';
      card.draggable = true;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="stop-dot ${TYPE_DOT[stop.type]}">${TYPE_EMOJI[stop.type]}</div>
        <div class="stop-body">
          <div class="stop-header">
            <span class="stop-type-badge ${TYPE_BADGE[stop.type]}">${stop.type}</span>
            <div class="stop-actions">
              <button onclick="moveStop(${i},-1)" title="Move up">↑</button>
              <button onclick="moveStop(${i},1)" title="Move down">↓</button>
              <button onclick="removeStop(${i})" title="Delete">✕</button>
            </div>
          </div>
          <div class="stop-content">
            <div class="stop-name">${stop.name}</div>
            ${stop.time ? `<div class="stop-time">🕐 ${stop.time}</div>` : ''}
            ${stop.notes ? `<div class="stop-notes">${stop.notes}</div>` : ''}
            ${stop.duration ? `<div class="stop-duration">⏱ ${stop.duration} min</div>` : ''}
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  // --- ADD STOP ---
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('stopName').focus();
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('stopName').value = '';
    document.getElementById('stopTime').value = '';
    document.getElementById('stopDuration').value = '';
    document.getElementById('stopNotes').value = '';
    selectType('place', document.querySelector('[data-type="place"]'));
  }
  function closeModalOutside(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function selectType(type, btn) {
    selectedType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function addStop() {
    const name = document.getElementById('stopName').value.trim();
    if (!name) { alert('Please enter a name'); return; }
    days[currentDayIndex].stops.push({
      type: selectedType,
      name,
      time: document.getElementById('stopTime').value,
      duration: parseInt(document.getElementById('stopDuration').value) || 0,
      notes: document.getElementById('stopNotes').value.trim()
    });
    saveItinerary();
    closeModal();
    renderDayList();
    renderStops();
  }

  function removeStop(i) {
    days[currentDayIndex].stops.splice(i, 1);
    saveItinerary();
    renderDayList();
    renderStops();
  }

  function moveStop(i, dir) {
    const stops = days[currentDayIndex].stops;
    const j = i + dir;
    if (j < 0 || j >= stops.length) return;
    [stops[i], stops[j]] = [stops[j], stops[i]];
    saveItinerary();
    renderStops();
  }

  // --- DAYS ---
  function addDay() {
    const n = days.length + 1;
    const lastDate = days[days.length-1].date;
    let newDate = '';
    if (lastDate) {
      const d = new Date(lastDate);
      d.setDate(d.getDate()+1);
      newDate = d.toISOString().split('T')[0];
    }
    days.push({ label:`Day ${n}`, date:newDate, stops:[] });
    currentDayIndex = days.length - 1;
    saveItinerary();
    renderDayList();
    renderStops();
  }

  // --- SAVE ---
  function saveItinerary() {
    localStorage.setItem(`itinerary_${tripId}`, JSON.stringify(days));
    // Also try to save to backend
    apiRequest(`/itinerary/${tripId}`, 'POST', { days }).catch(() => {});
  }

  function openSuggestions() {
    const dest = document.getElementById('tripDest').textContent || '';
    window.location.href = `/pages/city_suggestions.html?city=${encodeURIComponent(dest)}&trip_id=${tripId}&day=${currentDayIndex}`;
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }

  init();
</script>
</body>
</html>
