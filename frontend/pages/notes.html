{% extends "base.html" %}

{% block title %}Trip Notes | Traveloop{% endblock %}

{% block content %}
<div class="page-header flex justify-between items-center">
    <div>
        <h1 class="page-title">Trip Notes</h1>
        <p class="page-subtitle">Your personal travel journal.</p>
    </div>
    <div class="flex gap-4">
        <div class="form-group" style="margin: 0; min-width: 250px;">
            <input type="text" id="search-input" class="form-control" placeholder="Search notes..." onkeyup="searchNotes(event)">
        </div>
        <button class="btn" onclick="document.getElementById('add-note-modal').style.display='block'">
            <i data-feather="plus"></i> New Note
        </button>
    </div>
</div>

<div id="add-note-modal" class="glass-card" style="display: none; margin-bottom: 2rem;">
    <h3 class="mb-4">Create New Note</h3>
    <form onsubmit="addNote(event)">
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="note_title" class="form-control" required placeholder="E.g. Itinerary Ideas">
        </div>
        <div class="form-group">
            <label>Content</label>
            <textarea id="note_content" class="form-control" rows="4" required placeholder="Write your thoughts..."></textarea>
        </div>
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn">Save Note</button>
            <button type="button" class="btn btn-outline" onclick="document.getElementById('add-note-modal').style.display='none'">Cancel</button>
        </div>
    </form>
</div>

<div id="notes-grid" class="grid grid-cols-3">
    <!-- Notes loaded via JS -->
    <p class="text-muted" style="grid-column: span 3; text-align: center;">Loading your journal...</p>
</div>

<script>
    async function loadNotes() {
        try {
            const data = await apiCall(`/notes/${AppState.currentTripId}`);
            renderNotes(data.notes);
        } catch (error) {
            console.error(error);
        }
    }

    function renderNotes(notes) {
        const grid = document.getElementById('notes-grid');
        
        if (!notes || notes.length === 0) {
            grid.innerHTML = '<p class="text-muted" style="grid-column: span 3; text-align: center; margin-top: 2rem;">No notes found.</p>';
            return;
        }

        grid.innerHTML = notes.map(note => `
            <div class="glass-card note-card" style="position: relative;">
                <h3>${note.title}</h3>
                <p>${note.content}</p>
                <span class="note-date"><i data-feather="clock" style="width:12px; height:12px"></i> ${note.created_at || 'Just now'}</span>
                
                <button class="btn btn-outline" style="position: absolute; top: 1rem; right: 1rem; padding: 0.4rem; border:none; color: var(--danger)" onclick="deleteNote(${note.id})">
                    <i data-feather="trash-2" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
        `).join('');
        feather.replace();
    }

    async function addNote(e) {
        e.preventDefault();
        const title = document.getElementById('note_title').value;
        const content = document.getElementById('note_content').value;

        await apiCall('/notes/add', 'POST', {
            trip_id: AppState.currentTripId,
            note_title: title,
            note_content: content
        });
        
        showToast('Note added successfully');
        document.getElementById('add-note-modal').style.display = 'none';
        e.target.reset();
        loadNotes();
    }

    async function deleteNote(id) {
        if(confirm("Delete this note forever?")) {
            await apiCall(`/notes/delete/${id}`, 'DELETE');
            showToast('Note deleted');
            loadNotes();
        }
    }

    let searchTimeout;
    function searchNotes(e) {
        clearTimeout(searchTimeout);
        const query = e.target.value;
        
        searchTimeout = setTimeout(async () => {
            if (query.trim() === '') {
                loadNotes(); // Reset
                return;
            }
            try {
                const data = await apiCall(`/notes/search?q=${encodeURIComponent(query)}&trip_id=${AppState.currentTripId}`);
                renderNotes(data.results);
            } catch (error) {
                console.error(error);
            }
        }, 500);
    }

    document.addEventListener('DOMContentLoaded', loadNotes);
</script>
{% endblock %}
