<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveloop — Profile</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
  <style>
    .profile-wrapper{max-width:600px;margin:40px auto;padding:0 24px}
    .profile-card{background:var(--surface);border-radius:16px;padding:40px;box-shadow:var(--shadow);margin-bottom:24px}
    .avatar{width:80px;height:80px;border-radius:50%;background:var(--primary);color:white;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    .profile-name{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
    .profile-email{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:28px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
    .section-title{font-size:18px;font-weight:600;margin-bottom:16px}
    .danger-zone{border:1px solid var(--danger);border-radius:var(--radius);padding:20px}
    .danger-zone p{color:var(--text-muted);font-size:14px;margin-bottom:14px}
    .btn-danger{background:var(--danger);color:white;width:100%;padding:12px;font-size:15px;border-radius:var(--radius)}
    .success-box{background:#DCFCE7;color:#166534;padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;display:none}
    .success-box.show{display:block}
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-icon">✈</span>
      <span class="logo-text">Traveloop</span>
    </div>
    <div class="nav-links">
      <a href="/pages/dashboard.html">Home</a>
      <a href="/pages/my_trips.html">My Trips</a>
      <a href="/pages/profile.html" class="active">Profile</a>
    </div>
    <div class="nav-right">
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="profile-wrapper">

    <div class="profile-card">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="profile-email" id="profileEmail"></div>

      <div class="success-box" id="successBox">Changes saved!</div>
      <div class="error-box" id="errorBox"></div>

      <div class="section-title">Account Information</div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Your name"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="your@email.com"/>
      </div>

      <div class="form-group">
        <label>Preferred Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="ja">Japanese</option>
        </select>
      </div>

      <button class="btn-primary btn-full" onclick="saveProfile()">Save Changes</button>
    </div>

    <div class="profile-card">
      <div class="section-title">⚠️ Danger Zone</div>
      <div class="danger-zone">
        <p>Deleting your account is permanent and cannot be undone. All your trips and data will be lost.</p>
        <button class="btn-danger" onclick="deleteAccount()">Delete My Account</button>
      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) window.location.href = "/pages/login.html";

    // Populate fields
    document.getElementById("fullname").value = user.full_name || "";
    document.getElementById("email").value = user.email || "";
    document.getElementById("profileName").textContent = user.full_name || user.email;
    document.getElementById("profileEmail").textContent = user.email;
    const initial = (user.full_name || user.email || "?")[0].toUpperCase();
    document.getElementById("avatarInitial").textContent = initial;

    function saveProfile() {
      const fullname = document.getElementById("fullname").value.trim();
      if (!fullname) return;
      user.full_name = fullname;
      localStorage.setItem("user", JSON.stringify(user));
      document.getElementById("profileName").textContent = fullname;
      document.getElementById("avatarInitial").textContent = fullname[0].toUpperCase();
      document.getElementById("successBox").classList.add("show");
      setTimeout(() => document.getElementById("successBox").classList.remove("show"), 3000);
    }

    function deleteAccount() {
      if (!confirm("Are you sure? This cannot be undone.")) return;
      localStorage.removeItem("user");
      localStorage.removeItem("token");
      window.location.href = "/pages/login.html";
    }

    function handleLogout() {
      localStorage.removeItem("user");
      localStorage.removeItem("token");
      window.location.href = "/pages/login.html";
    }
  </script>

</body>
</html>
