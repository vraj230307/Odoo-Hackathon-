{% extends "base.html" %}

{% block title %}Shared Itinerary | Traveloop{% endblock %}

{% block content %}
<div class="page-header flex justify-between items-center">
    <div>
        <h1 class="page-title" id="trip-destination">Loading Trip...</h1>
        <p class="page-subtitle">A shared public itinerary.</p>
    </div>
    <div>
        <button class="btn" onclick="copyTrip()"><i data-feather="copy"></i> Copy to My Account</button>
    </div>
</div>

<div class="grid grid-cols-2 mt-4">
    <!-- Packing List Preview -->
    <div class="glass-card">
        <h3 class="mb-4"><i data-feather="check-square" style="color: var(--primary);"></i> Items to Pack</h3>
        <div id="shared-packing-list">
            <!-- Loaded via JS -->
            <p class="text-muted">Loading packing list...</p>
        </div>
    </div>

    <!-- Notes Preview -->
    <div class="glass-card">
        <h3 class="mb-4"><i data-feather="book-open" style="color: var(--secondary);"></i> Trip Notes</h3>
        <div id="shared-notes-list" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Loaded via JS -->
            <p class="text-muted">Loading notes...</p>
        </div>
    </div>
</div>

<!-- We use a hidden script tag to pass the token from Flask -->
<script id="token-data" type="application/json">"{{ token }}"</script>

<script>
    const shareToken = JSON.parse(document.getElementById('token-data').textContent);

    async function loadSharedItinerary() {
        try {
            const data = await apiCall(`/share/${shareToken}`);
            
            // Header
            document.getElementById('trip-destination').textContent = data.trip.destination;

            // Packing Items
            const packingDiv = document.getElementById('shared-packing-list');
            if(data.packing_items && data.packing_items.length > 0) {
                packingDiv.innerHTML = data.packing_items.map(item => `
                    <div class="flex justify-between items-center mb-4 pb-2" style="border-bottom: 1px solid var(--border-color);">
                        <span>${item.item_name}</span>
                        <span class="badge ${item.packed_status ? 'badge-primary' : ''}" style="opacity: 0.7;">
                            ${item.packed_status ? 'Packed' : item.category}
                        </span>
                    </div>
                `).join('');
            } else {
                packingDiv.innerHTML = '<p class="text-muted">No items in packing list.</p>';
            }

            // Notes
            const notesDiv = document.getElementById('shared-notes-list');
            if(data.notes && data.notes.length > 0) {
                notesDiv.innerHTML = data.notes.map(note => `
                    <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 8px;">
                        <h4 style="color: var(--primary); margin-bottom: 0.5rem;">${note.title}</h4>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">${note.content}</p>
                    </div>
                `).join('');
            } else {
                notesDiv.innerHTML = '<p class="text-muted">No notes available.</p>';
            }

        } catch (error) {
            console.error("Failed to load shared itinerary:", error);
            document.getElementById('trip-destination').textContent = "Trip Not Found";
        }
    }

    async function copyTrip() {
        try {
            const data = await apiCall(`/share/copy/${shareToken}`, 'POST', {
                user_id: AppState.currentUserId
            });
            showToast('Trip copied to your account! ID: ' + data.new_trip_id);
            // In a real app, redirect to the trip dashboard
            setTimeout(() => { window.location.href = "/"; }, 2000);
        } catch (error) {
            console.error(error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadSharedItinerary);
</script>
{% endblock %}
